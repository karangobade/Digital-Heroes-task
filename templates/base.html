<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lead Platform{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('capture_form') }}">Lead Platform</a>
    <nav>
      {% if current_user.is_authenticated %}
        <span class="who">{{ current_user.name }} · {{ current_user.role }}</span>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Log out</a>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Built for Digital Heroes Training Task · <a href="https://digitalheroesco.com" target="_blank" rel="noopener">digitalheroesco.com</a>
  </footer>
</body>
</html>
